apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jianghu-ling
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName:  # 按集群默认 StorageClass；需要时取消注释并指定
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jianghu-ling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: jianghu-ling
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jianghu-ling
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
