apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jianghu-ling
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jianghu-ling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: jianghu-ling
    spec:
      containers:
        - name: backend
          image: 10.120.20.201:5000/jianghu-ling-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jianghu-ling-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jianghu-ling-secrets
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jianghu-ling-secrets
                  key: JWT_SECRET
            - name: INVITE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: jianghu-ling-config
                  key: INVITE_BASE_URL
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jianghu-ling
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
