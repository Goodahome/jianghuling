apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: jianghu-ling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: jianghu-ling
    spec:
      containers:
        - name: frontend
          image: 10.120.20.201:5000/jianghu-ling-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: jianghu-ling
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
