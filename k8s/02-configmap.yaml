apiVersion: v1
kind: ConfigMap
metadata:
  name: jianghu-ling-config
  namespace: jianghu-ling
  labels:
    app.kubernetes.io/name: jianghu-ling
data:
  # 使用平台现有 MySQL（不在本 ns 内部署）
  MYSQL_HOST: "mysql.ks-platform-dev.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DB: "jianghu_ling"
  MYSQL_USER: "root"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  UPLOAD_DIR: "/data/uploads"
  SPRING_PROFILES_ACTIVE: "dev"
  MOCK_SMS_CODE: "123456"
  INVITE_BASE_URL: "https://jianghu.kssrol.com/r/"
